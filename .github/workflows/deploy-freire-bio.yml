name: Publicar bio Freire no Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'freire-bio/site/**'
      - '.github/workflows/deploy-freire-bio.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: freire-bio-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar bio
    if: ${{ vars.CLOUDFLARE_BIO_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Verificar credenciais de publicação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos segredos do repositório"
            exit 1
          fi

      - name: Publicar em Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy freire-bio/site --project-name=${{ vars.CLOUDFLARE_BIO_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
